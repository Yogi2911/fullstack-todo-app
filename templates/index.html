<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Full-Stack Todo App</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="container">
    <h1>📝 Todo List</h1>
    <p class="subtitle">Flask + SQLite + Vanilla JS</p>

    <form id="todo-form">
      <input type="text" id="task-input" placeholder="What needs to be done?" autocomplete="off" required />
      <button type="submit">Add</button>
    </form>

    <ul id="todo-list"></ul>

    <p id="empty-state" class="empty-state" hidden>No todos yet. Add one above!</p>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
